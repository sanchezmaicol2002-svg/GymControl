<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymControl - Iniciar sesión</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="contenedor-login">
    <form class="tarjeta-login" action="#" method="post">

      <div class="logo">
        <span class="logo-icono">🏋️</span>
        <span class="logo-texto">GYMCONTROL</span>
      </div>
      <p class="subtitulo">Sistema de gestión para gimnasios</p>

      <h1>Iniciar sesión</h1>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="admin@gymcontrol.com" required>
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
      </div>

      <div class="fila-opciones">
        <label class="recordarme">
          <input type="checkbox" id="recordar" name="recordar">
          <span>Recordarme</span>
        </label>
        <a href="#" class="enlace-olvide">¿Olvidaste tu contraseña?</a>
      </div>

      <a href="dashboard.html" class="boton-primario">Iniciar sesión</a>

    </form>
  </div>

</body>
</html>
